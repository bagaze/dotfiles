onboarding = false

[theme]
name = "tokyo-night"
auto_switch = false

[ui]
agent_panel_sort = "priority"

tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "datetime", format = "%d %b %H:%M" },
  { type = "command", command = "~/.config/herdr/status.sh", interval_seconds = 5, timeout_seconds = 2 },
]
tab_bar_right_separator = " · "

[keys]
prefix = "ctrl+space"
goto = "prefix+space"
switch_workspace = "prefix+shift+1..9" # prefix then shift + number jumps to that workspace
navigate_workspace_up = "k"
navigate_workspace_down = "j"
next_workspace = "cmd+shift+j"
previous_workspace = "cmd+shift+k"
next_tab = "cmd+shift+l"
previous_tab = "cmd+shift+h"
move_tab_previous = "cmd+shift+left"
move_tab_next = "cmd+shift+right"
split_horizontal = "prefix+;"
split_vertical = "prefix+'"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
